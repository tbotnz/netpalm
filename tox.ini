[tox]
env_list = lint, typecheck, unit
isolated_build = true

[testenv:unit]
description = Run unit tests
deps =
    pytest
    pytest-timeout
    pytest-mock
    httpx
commands =
    pytest tests/unit -vv {posargs}

[testenv:integration]
description = Run integration tests (requires running stack)
deps =
    pytest
    pytest-timeout
    pytest-mock
commands =
    pytest tests/integration -m "not fulllab" -vv {posargs}

[testenv:lint]
description = Run linting and formatting checks
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs:.}
    ruff format --check {posargs:.}

[testenv:typecheck]
description = Run type checking
deps =
    mypy
commands =
    mypy netpalm {posargs}
